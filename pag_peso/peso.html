<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saúde +</title>
    <link rel="stylesheet" href="peso.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <header class="navbar navbar-expand-lg navbar-dark fixed-top style_bg_nav">
        <div class="container-fluid">
            <button class="btn btn-outline-dark" id="toggleSidebar">Menu</button>
            <a id="button_menu" class="style_logo" href="#">Saúde <strong id="itemMais_logo">+</strong></a>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
        <ul class="nav flex-column itens__sidebar">
            <li class="nav-item item__sidebar">
                <a class="nav-link" id="homeLink">
                    <img src="../Icones/home.svg" alt="Ícone Hidratação" class="icon_sideBar" />
                    <span class="item-text">Home</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link" id="pesoLink">
                    <img src="../Icones/peso.svg" alt="Ícone Peso" class="icon_sideBar" />
                    <span class="item-text">Peso</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link" id="medidasLink">
                    <img src="../Icones/medidas.svg" alt="Ícone Medidas" class="icon_sideBar" />
                    <span class="item-text">Medidas</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link" id="metricasLink">
                    <img src="../Icones/metricas.svg" alt="Ícone Metricas" class="icon_sideBar" />
                    <span class="item-text">Metricas</span>
                </a>
            </li>
            <li class="nav-item item__sidebar">
                <a class="nav-link"  id="dietaLink">
                    <img src="../Icones/dieta.svg" alt="Ícone Dieta" class="icon_sideBar" />
                    <span class="item-text">Dieta</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link"  id="exercicioLink">
                    <img src="../Icones/exercicios.svg" alt="Ícone Exercicios" class="icon_sideBar" />
                    <span class="item-text">Exercicios</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link" id="perfilLink">
                    <img src="../Icones/perfil.svg" alt="Ícone Perfil" class="icon_sideBar" />
                    <span class="item-text">Perfil</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link" id="logoutLink">
                    <img src="../Icones/logout.svg" alt="Ícone Hidratação" class="icon_sideBar" />
                    <span class="item-text">Sair</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="container_principal">
        <div class="primeira_linha">

            <div class="peso">
                <p id="modif_peso2">PESO ATUAL: <span id="peso_atual"></span></p>
                <img src="..\Icones\modificar.svg" id="modif_peso" class="bot_modif">
                
                <div class="alterar_peso" id="alterar_peso">
                <p class ="novo_peso" >NOVO PESO: <span id="peso-valor"></span></p>
                <div class="peso_box">
                    <h1 id="menos_peso" onmousedown="inicia_ajustepeso(-0.1)" onmouseup="finaliza_ajustepeso()" onmouseleave="finaliza_ajustepeso()">-</h1>
                    <input type="range" id="peso" class="slider_peso" name="peso" min="30" max="300" step="0.1" oninput="atualizaPeso(this.value)">
                    <h1 id="mais_peso" onmousedown="inicia_ajustepeso(0.1)" onmouseup="finaliza_ajustepeso()" onmouseleave="finaliza_ajustepeso()">+</h1>
                </div>
                <img src="..\Icones\cancela.svg" id="exit_peso"  class="bot_modif">
                <img src="..\Icones\confirma.svg" id="edit_peso" class="bot_modif">
                </div>
            </div>

            <div class="peso">
                <div class="peso_ideal2">
                <p>PESO IDEAL ESTIMADO: <span id="peso_ideal"></span></p>
                <p><span id="diferenca_peso"></span></p>
            </div>
            </div>
            <div class="peso">
                <p><span id="titulo_periodo"></span></p>
                <p>VARIAÇÃO DO PESO: <span id="peso_var"></span></p>
            </div>
        </div>
        <div class="pesol2">
        <canvas id="graficoPeso" class="grafico" ></canvas>
        <input type="range" class="barra-rolagem" id="barraRolagem" min="0" step="1">
        <div class="periodos">
            <p class="txt_periodos" id="semana">semana</p>
            <p class="txt_periodos" id="mes">mês</p>
            <p class="txt_periodos" id="ano">ano</p>
            <p class="txt_periodos" id="inicio">inicio</p>
        </div>
        </div>
    </div>
    
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="peso.js"></script>
</body>

</html>
