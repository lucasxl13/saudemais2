<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saúde +</title>
    <link rel="stylesheet" href="principal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body>

    <header class="navbar navbar-expand-lg navbar-dark fixed-top style_bg_nav">
        <div class="container-fluid">
            <button class="btn btn-outline-dark" id="toggleSidebar">Menu</button>
            <a id="button_menu" class="style_logo" href="#">Saúde <strong id="itemMais_logo">+</strong></a>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
        <ul class="nav flex-column itens__sidebar">
            <li class="nav-item item__sidebar">
                <a class="nav-link" id="homeLink">
                    <img src="../Icones/home.svg" alt="Ícone Hidratação" class="icon_sideBar" />
                    <span class="item-text">Home</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link" id="pesoLink">
                    <img src="../Icones/peso.svg" alt="Ícone Peso" class="icon_sideBar" />
                    <span class="item-text">Peso</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link"  id="hidratacaoLink">
                    <img src="../Icones/hidatracao.svg" alt="Ícone Hidratação" class="icon_sideBar" />
                    <span class="item-text">Hidratação</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link"  id="calorialink">
                    <img src="../Icones/calorias.svg" alt="Ícone Calorias" class="icon_sideBar" />
                    <span class="item-text">Calorias</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link"  id="dietalink">
                    <img src="../Icones/dieta.svg" alt="Ícone Dieta" class="icon_sideBar" />
                    <span class="item-text">Dieta</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link" id="perfilLink">
                    <img src="../Icones/perfil.svg" alt="Ícone Perfil" class="icon_sideBar" />
                    <span class="item-text">Perfil</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link" id="logoutlink">
                    <img src="../Icones/logout.svg" alt="Ícone Hidratação" class="icon_sideBar" />
                    <span class="item-text">Sair</span>
                </a>
            </li>
        </ul>
    </div>

    <div class="primeira_linha">
        <div class="containers" id="container_peso">
            <span id="peso"></span>
            <span id="peso_ideal"></span>
            <canvas id="graficoPeso" width="400" height="200"></canvas>
        </div>
    
    <div class="containers">

        <p class="txt_medidas" id="obj_altura">Altura:</p>

        <div class="container_medidas">
        <div class="medidas_direita">
        <p class="txt_medidas" id="obj_biceps_direito">Biceps direito:</p>
        <p class="txt_medidas" id="obj_antebraco_direito">Antebraço direito:</p>
        <p class="txt_medidas" id="obj_coxa_direito">Coxa direita:</p>
        <p class="txt_medidas" id="obj_panturilha_direito">Panturilha direita:</p>
        </div>

        <div id="svg_medidas"></div>

        <div class="medidas_esquerda">
        <p class="txt_medidas" id="obj_biceps_esquerdo">Biceps esquerdo:</p>
        <p class="txt_medidas" id="obj_antebraco_esquerdo">Antebraço esquerdo:</p>
        <p class="txt_medidas" id="obj_coxa_esquerdo">Coxa esquerda:</p>
        <p class="txt_medidas" id="obj_panturilha_esquerdo">Panturilha esquerda:</p>
        </div>
        </div>

        <p class="txt_medidas" id="obj_cintura">Cintura</p>
    </div>   

    <div class="containers">
        <h1>teste</h1>
    </div>   
</div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="principal.js"></script>      
</body>
</html>
