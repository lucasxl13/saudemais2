<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saúde +</title>
  <link rel="stylesheet" href="principal.css" />
  <link rel="stylesheet" href="../elementosCSS/chat.css" />
  <link rel="stylesheet" href="../componentes/bootstrap/css/bootstrap.min.css" />
</head>

<body>
  <!-- Navbar -->
  <header class="navbar navbar-expand-lg navbar-dark fixed-top style_bg_nav">
    <div class="container-fluid">
      <button class="btn_sidebar" id="toggleSidebar">Menu</button>
      <a id="button_menu" class="style_logo" href="#">Saúde <strong id="itemMais_logo">+</strong></a>
    </div>
  </header>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <ul class="nav flex-column itens__sidebar" id="sidebarMenu"></ul>
  </div>

  <!-- Botão flutuante -->
  <div id="chatToggle">💬</div>

  <!-- Janela do chat -->
  <div id="chatContainer">
    <div id="chatHeader">Chat</div>
    <div id="chatMessages"></div>
    <form id="chatForm">
      <input type="text" id="chatInput" placeholder="Digite sua mensagem..." required />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <div class="container_principal">
    <div class="linha">
      <div class="containers_topo">
        <div class="container_usuario">
          <div class="foto-perfil">
            <img id="fotoPerfil" src="../elementosCSS/225-default-avatar.png" alt="Avatar">
            <div class="info-usuario">
              <p>Olá, <span id="nomeUsuario"></span></p>
            </div>
          </div>
          
          <p>Idade: <span id="idadeUsuario"></span></p>
          <p>Objetivo: <span id="objetivoUsuario"></span></p>
        </div>
      </div>

      <div class="containers_topo">
        <div class="container_peso">
          <canvas id="graficoPeso"></canvas>
        </div>
      </div>

      <div class="containers_topo">
        <div class="container_medida">
          <div id="silhueta_container"></div>
        </div>
      </div>
    </div>


    <div class="linha">
      <div class="containers_meio">
        <div class="container_calorias">
          <div class="container_grafico">
            <div class="botoes-lado">
              <button class="botao_diminui" data-valor="1">-1</button>
              <button class="botao_diminui" data-valor="10">-10</button>
              <button class="botao_diminui" data-valor="100">-100</button>
            </div>
        
            <canvas id="graficoCaloria"></canvas>
        
            <div class="botoes-lado">
              <button class="botao_aumenta" data-valor="1">+1</button>
              <button class="botao_aumenta" data-valor="10">+10</button>
              <button class="botao_aumenta" data-valor="100">+100</button>
            </div>
          </div>
          <div id="icone_streak"></div>
          <div class="barra_streak" id="barraStreakCal"></div>
        </div>
      </div>

      <div class="containers_meio">
        <div class="container_hidratacao">
          <div class="container_grafico">
            <div class="botoes-lado">
              <button class="botao_diminui" data-valor="1">-1</button>
              <button class="botao_diminui" data-valor="10">-10</button>
              <button class="botao_diminui" data-valor="100">-100</button>
            </div>

            <canvas id="graficoHidratacao"></canvas>

            <div class="botoes-lado">
              <button class="botao_aumenta" data-valor="1">+1</button>
              <button class="botao_aumenta" data-valor="10">+10</button>
              <button class="botao_aumenta" data-valor="100">+100</button>

            </div>
          </div>
          <div id="icone_streak_hidro"></div>
          <div class="barra_streak" id="barraStreakHidro"></div>
        </div>
      </div>

      <div class="containers_meio">
        
      </div>
    </div>

    <!-- Linha 3 -->
    <div class="linha">
      <div class="containers_fundo"></div>
      <div class="containers_fundo"></div>
    </div>
  </div>

  <!-- Fallback para Chart.js -->
  <script>
    window.addEventListener('error', function fallbackChartJS(e) {
      if (e.target.tagName === 'SCRIPT' && e.target.src.includes('chart.js')) {
        const scriptLocal = document.createElement('script');
        scriptLocal.src = '../componentes/chartJS/chart.min.js';
        document.head.appendChild(scriptLocal);
      }
    }, true);
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Scripts principais -->
  <script type="module" src="./principal.js"></script>
  <script type="module" src="../Funcoes/chat.js"></script>
</body>

</html>
