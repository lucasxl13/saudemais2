<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saúde +</title>
    <link rel="stylesheet" href="principal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>


<body>

    <header class="navbar navbar-expand-lg navbar-dark fixed-top style_bg_nav">
        <div class="container-fluid">
            <button class="btn btn-outline-dark" id="toggleSidebar">Menu</button>
            <a id="button_menu" class="style_logo" href="#">Saúde <strong id="itemMais_logo">+</strong></a>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
        <ul class="nav flex-column itens__sidebar">
            <li class="nav-item item__sidebar">
                <a class="nav-link" id="homeLink">
                    <img src="../icones\home.svg" alt="Ícone Hidratação" class="icon_sideBar" />
                    <span class="item-text">Home</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link"  id="hidratacaoLink">
                    <img src="../icones/hidatracao.svg" alt="Ícone Hidratação" class="icon_sideBar" />
                    <span class="item-text">Hidratação</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link"  id="calorialink">
                    <img src="../icones/calorias.svg" alt="Ícone Calorias" class="icon_sideBar" />
                    <span class="item-text">Calorias</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link"  id="dietalink">
                    <img src="../icones/dieta.svg" alt="Ícone Dieta" class="icon_sideBar" />
                    <span class="item-text">Dieta</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link" id="perfilLink">
                    <img src="../icones/perfil.svg" alt="Ícone Perfil" class="icon_sideBar" />
                    <span class="item-text">Perfil</span>
                </a>
            </li>

            <li class="nav-item item__sidebar">
                <a class="nav-link" id="logoutlink">
                    <img src="../icones/logout.svg" alt="Ícone Hidratação" class="icon_sideBar" />
                    <span class="item-text">Sair</span>
                </a>
            </li>
        </ul>
    </div>   

    <div>
        <h1>Dados do Usuário</h1>
        <p><strong>Usuário:</strong> <span id="usuario"></span></p>
        <p><strong>Email:</strong> <span id="email"></span></p>
        <p><strong>Data de Nascimento:</strong> <span id="data_nascimento"></span></p>
        <p><strong>Sexo:</strong> <span id="sexo"></span></p>
        <p><strong>Objetivo:</strong> <span id="objetivo"></span></p>
    </div>

    <div>
        <canvas id="graficoMedidas" width="400" height="200"></canvas>
    </div>

    <!-- Tabela para exibir todas as medições -->
    <div>
        <h2>Histórico de Medições</h2>
        <table>
            <thead>
                <tr>
                    <th>Data da Medição</th>
                    <th>Altura</th>
                    <th>Peso</th>
                </tr>
            </thead>
            <tbody id="medidas-table-body">
                <!-- Os dados de medições serão inseridos dinamicamente aqui -->
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="principal.js"></script>      
</body>
</html>
