<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saúde +</title>
  <link rel="icon" href="..\Icones\logo.png" type="image/png">
  <link rel="stylesheet" href="../elementosCSS/chat.css" />
  <link rel="stylesheet" href="../componentes/bootstrap/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../componentes/bootstrap/css/bootstrap-icons.css">
  <link rel="stylesheet" href="principal.css" />
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <ul class="nav flex-column itens__sidebar" id="sidebarMenu"></ul>
  </div>

  <!-- Botão flutuante -->
  <div id="chatToggle">🤖</div>

  <!-- Janela do chat -->
  <div id="chatContainer">
    <div id="chatHeader">Chat</div>
    <div id="chatMessages"></div>
    <form id="chatForm">
      <input type="text" id="chatInput" placeholder="Digite sua mensagem..." required />
      <button type="submit">Enviar</button>
    </form>
  </div>

  <div id="modal-conexao" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>Nova solicitação de conexão!</h3>
      
      <div class="modal-perfil">
        <img id="modal-avatar-prof" src="" alt="Avatar Professor" class="modal-avatar" onerror="this.src='../elementosCSS/225-default-avatar.png'">
        <p>O professor <strong id="modal-nome-prof"></strong> quer se conectar a você.</p>
      </div>

      <div class="modal-acoes">
        <button id="btn-recusar-conexao" class="btn-modal btn-recusar">Recusar</button>
        <button id="btn-aceitar-conexao" class="btn-modal btn-aceitar">Aceitar</button>
      </div>
    </div>
  </div>

  <div class="container_principal">
    <div class="linha">
      <div class="containers_topo">
        <div class="container_usuario" id="container_usuario">
          <div class="foto-perfil">
            <img id="fotoPerfil" src="../elementosCSS/225-default-avatar.png" alt="Avatar">
            <div class="info-usuario">
              <p>Olá, <span id="nomeUsuario"></span></p>
            </div>
          </div>
          
          <strong><p>IDADE: <span id="idadeUsuario"></span></p></strong>
          <strong><p>SEXO: <span id="sexoUsuario"></span></p></strong>
          <strong><p>OBJETIVO: <span id="objetivoUsuario"></span></p></strong>

        </div>
      </div>

      <div class="containers_topo">
        <div class="container_peso" id="container_peso">
          <canvas id="graficoPeso"></canvas>
        </div>
      </div>

      <div class="containers_topo">
        <div class="container_medida" id="container_medida">
          <div id="silhueta_container"></div>
        </div>
      </div>
    </div>


    <div class="linha">
      <div class="containers_meio">
        <div class="container_calorias">
          <div class="container_grafico">
            <div class="botoes-lado">
              <button class="botao_diminui" data-valor="1">-1</button>
              <button class="botao_diminui" data-valor="10">-10</button>
              <button class="botao_diminui" data-valor="100">-100</button>
            </div>
        
            <canvas id="graficoCaloria"></canvas>
        
            <div class="botoes-lado">
              <button class="botao_aumenta" data-valor="1">+1</button>
              <button class="botao_aumenta" data-valor="10">+10</button>
              <button class="botao_aumenta" data-valor="100">+100</button>
            </div>
          </div>
          <div id="icone_streak"></div>
          <div class="barra_streak" id="barraStreakCal"></div>
        </div>
      </div>

      <div class="containers_meio">
        <div class="container_hidratacao">
          <div class="container_grafico">
            <div class="botoes-lado">
              <button class="botao_diminui" data-valor="1">-1</button>
              <button class="botao_diminui" data-valor="10">-10</button>
              <button class="botao_diminui" data-valor="100">-100</button>
            </div>

            <canvas id="graficoHidratacao"></canvas>

            <div class="botoes-lado">
              <button class="botao_aumenta" data-valor="1">+1</button>
              <button class="botao_aumenta" data-valor="10">+10</button>
              <button class="botao_aumenta" data-valor="100">+100</button>

            </div>
          </div>
          <div id="icone_streak_hidro"></div>
          <div class="barra_streak" id="barraStreakHidro"></div>
        </div>
      </div>

      <div class="containers_meio">
        <div class="container_metricas" id="container_metricas">
        <p><span class="icones" id="icon_imc"></span>IMC: <span id="imc"></span><span id="status_imc"></span></p>
        <p><span class="icones" id="icon_fogo"></span>TAXA BASAL: <span id="taxa_metabolica"></span></p>
        <p><span class="icones" id="icon_gordura"></span>GORDURA CORPORAL: <span id="gordura_corporal"></span></p>
        <p><span class="icones" id="icon_agua"></span>ÁGUA CORPORAL: <span id="agua_corporal"></span></p>
        <p><span class="icones" id="icon_musculo"></span>MÚSCULO ESQUELETICO: <span id="musculos"></span></p>
      </div>
    </div>
  </div>
  <div class="espaco-final"></div>

  <!-- Fallback para Chart.js -->
  <script>
    window.addEventListener('error', function fallbackChartJS(e) {
      if (e.target.tagName === 'SCRIPT' && e.target.src.includes('chart.js')) {
        const scriptLocal = document.createElement('script');
        scriptLocal.src = '../componentes/chartJS/chart.min.js';
        document.head.appendChild(scriptLocal);
      }
    }, true);
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Scripts principais -->
  <script type="module" src="./principal.js"></script>
  <script type="module" src="../Funcoes/chat.js"></script>
</body>

</html>
