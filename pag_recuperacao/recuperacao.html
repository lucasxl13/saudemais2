<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saúde +</title>
  <link rel="icon" href="../Icones/logo.png" type="image/png" />
  <link rel="stylesheet" href="../componentes/bootstrap/css/bootstrap-icons.css">
  <link rel="stylesheet" href="recuperacao.css" />
</head>
<body>
  <div class="container_principal">
    <div class="logo">
      <img src="../Icones/logo.png" alt="Saúde mais" class="logo_icon" />
      <h1 class="titulo">SAÚDE <strong class="subtitulo">+</strong></h1>
    </div>

    <div class="box_recuperacao">
      <p>Defina sua nova senha:</p>

      <form id="form_nova_senha" novalidate>
        <div class="formulario">
          <div class="campo-senha">
            <input type="password" id="nova_senha" name="nova_senha" placeholder="Nova senha (mín. 8)" required minlength="8" />
            <i class="bi bi-eye toggle-senha" data-target="nova_senha"></i>
          </div>
          <span class="erro" id="nova_senha_erro"></span>
        </div>

        <div class="formulario">
          <div class="campo-senha">
            <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Confirmar senha" required minlength="8" />
            <i class="bi bi-eye toggle-senha" data-target="confirmar_senha"></i>
          </div>
          <span class="erro" id="confirmar_senha_erro"></span>
        </div>

        <button type="submit" class="acoes">Salvar nova senha</button>
      </form>
    </div>
  </div>

  <script type="module" src="./recuperacao.js"></script>
  </script>
</body>
</html>
