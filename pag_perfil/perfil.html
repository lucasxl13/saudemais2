<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saúde +</title>
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="..\componentes\bootstrap\css\bootstrap.min.css">
  </head>

<body>

    <header class="navbar navbar-expand-lg navbar-dark fixed-top style_bg_nav">
        <div class="container-fluid">
            <button class="btn_sidebar" id="toggleSidebar">Menu</button>
            <a id="button_menu" class="style_logo" href="#">Saúde <strong id="itemMais_logo">+</strong></a>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
        <ul class="nav flex-column itens__sidebar" id="sidebarMenu"></ul>
    </div>

    <div class="container-perfil">
      <div class="perfil-header">
        <div class="foto-perfil">
          <img id="fotoPerfil" src="../elementosCSS/225-default-avatar.png" alt="Avatar">
        </div>
        <div class="info-perfil">
          <h2 id="nomeUsuario">Carregando...</h2>
          <p><strong>Email:</strong> <span id="emailUsuario"></span></p>
          <p><strong>Sexo:</strong> <span id="sexoUsuario"></span></p>
          <p><strong>Idade:</strong> <span id="idadeUsuario"></span></p>
          <p><strong>Objetivo:</strong> <span id="objetivoUsuario"></span></p>
        </div>      
        <div class="info-extra">
          <h3>Estatísticas Recentes</h3>
          <p>🔥 Streak Calorias: <span id="streakCalorias"></span> dias</p>
          <p>💧 Streak Hidratação: <span id="streakHidratacao"></span> dias</p>
          <p>⚖️ Último Peso: <span id="pesoUsuario"></span> kg</p>
          <p>📏 Altura: <span id="alturaUsuario"></span> cm</p>
          <p>📈 IMC: <span id="imcUsuario"></span></p>
        </div>
      </div>
    
      <div class="perfil-cards">
        <div class="card-perfil">Card 1</div>
        <div class="card-perfil">Card 2</div>
        <div class="card-perfil">Card 3</div>
        <div class="card-perfil">Card 4</div>
      </div>
    </div>
       
    

<script type="module" src="./perfil.js"></script>
</body>

</html>
